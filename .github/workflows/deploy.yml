name: Deploy Frontend a EC2

on:
  push:
    braches:
      - deploy

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: frontvidasalud
  SERVICE_NAME: frontend-svc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Iniciar sesión en Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Construir, etiquetar y subir imagen a ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: latest
        run: |
          # Pasamos la variable de entorno al Dockerfile usando --build-arg
          docker build --build-arg VITE_API_URL=${{ vars.VITE_API_URL }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Desplegar vía AWS Systems Manager
        run: |
          COMMANDS='
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | sudo docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
            IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            sudo docker pull $IMAGE_URI
            sudo docker stop vidasalud-frontend || true
            sudo docker rm vidasalud-frontend || true
            sudo docker run -d --name vidasalud-frontend -p 80:80 --restart always $IMAGE_URI
            sudo docker system prune -af
          '
          
          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=instanceIds,Values=${{ secrets.AWS_INSTANCE_ID }}" \
            --parameters commands=["$COMMANDS"] \
            --query "Command.CommandId" \
            --output text)
            
          echo "Esperando a que EC2 termine la ejecución..."
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_INSTANCE_ID }}"
          
          echo "--- LOGS DEL SERVIDOR EC2 ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_INSTANCE_ID }}" --query "StandardOutputContent" --output text
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "${{ secrets.AWS_INSTANCE_ID }}" --query "StandardErrorContent" --output text